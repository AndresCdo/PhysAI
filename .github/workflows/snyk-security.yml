# Snyk security scanning.
#
# This workflow is skipped unless a SNYK_TOKEN repository secret exists. To
# enable it, create a token at https://app.snyk.io/account and add it under
# Settings > Secrets and variables > Actions > New repository secret.
#
# The `secrets` context is not available in a job-level `if`, so the token is
# exposed as a job-level env var and each step is gated on it. See
# https://docs.github.com/en/actions/reference/workflows-and-actions/contexts

name: Snyk Security

on:
  push:
    branches: [ "main", "dev" ]
  pull_request:
    branches: [ "main", "dev" ]

permissions:
  contents: read

jobs:
  snyk:
    permissions:
      contents: read # for actions/checkout to fetch code
      security-events: write # for github/codeql-action/upload-sarif to upload SARIF results
      actions: read # only required for a private repository by github/codeql-action/upload-sarif to get the Action run status
    runs-on: ubuntu-latest
    env:
      # Job-level, so every `snyk` invocation below inherits it. Scoping this to
      # the setup step alone left the steps that actually call the CLI
      # unauthenticated.
      SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: Report that Snyk is not configured
        if: env.SNYK_TOKEN == ''
        run: |
          echo "::notice title=Snyk skipped::No SNYK_TOKEN repository secret is configured, so every Snyk step is skipped. Add the secret to enable scanning."

      - name: Set up Snyk CLI to check for security issues
        if: env.SNYK_TOKEN != ''
        uses: snyk/actions/setup@806182742461562b67788a64410098c9d9b96adb

        # Runs Snyk Code (SAST) analysis and uploads result into GitHub.
      - name: Snyk Code test
        if: env.SNYK_TOKEN != ''
        run: snyk code test --sarif > snyk-code.sarif

        # Runs Snyk Open Source (SCA) analysis and uploads result to Snyk.
      - name: Snyk Open Source monitor
        if: env.SNYK_TOKEN != ''
        run: snyk monitor --all-projects

        # Runs Snyk Infrastructure as Code (IaC) analysis and uploads result to Snyk.
      - name: Snyk IaC test and report
        if: env.SNYK_TOKEN != ''
        run: snyk iac test --report

        # Push the Snyk Code results into GitHub Code Scanning tab
      - name: Upload result to GitHub Code Scanning
        if: env.SNYK_TOKEN != ''
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: snyk-code.sarif
